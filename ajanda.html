const BIRIMLER=['Bilgi Sistemleri Birimi','Personel Birimi','Kalite Birimi','Eğitim Birimi','Disiplin Birimi','Teknik Birim','Depo Birimi','Tıbbi Cihaz Birimi','Ayniyat Birimi','Ambulans Bakım Birimi','Arşiv Birimi','SKKM Birimi','SAKOM Birimi'];

const TABS={
 bashekim:['Başhekim Planlama','Başhekim genel masa ajandası. Herkes görür, yalnızca yönetici yazar.','👔','navy','Genel'],
 birim:['Birim Planlama (Mesai)','Mesai birimleri ajandası. Yalnızca ilgili birim ve yöneticiler görür.','👥','petrol','Birim'],
 nobet:['Birim Planlama (Nöbet)','Nöbet birimleri ajandası. Yalnızca ilgili birim ve yöneticiler görür.','🌙','plum','Nöbet'],

  if(p.rol!=='birim_kullanicisi')return TABLAR[p.rol];
  const m=p.birimler.some(b=>MESAI.includes(b)),n=p.birimler.some(b=>NOBET.includes(b)||b===SKM);

};

function showLogin(){me=null;clearInterval(tickH);clearInterval(yenH);$('app').classList.add('hide');location.replace('index.html')}

const dkKalan=e=>{const[y,m,d]=e.tarih.split('-').map(Number),[h,mi]=e.saat.split(':').map(Number);return Math.round((new Date(y,m-1,d,h,mi)-new Date())/60000)};
const sureMetni=dk=>{const a=Math.abs(dk),t=(a>=60?Math.floor(a/60)+' sa '+(a%60?a%60+' dk':''):a+' dk').trim();return dk<0?`Geçti (${t} önce)`:dk===0?'Şimdi':`${t} kaldı`};
const hbl=e=>e.tur==='koordinasyon'?['SKKM']:(e.hedef_birimler||[]);
const ilgili=e=>e.tur==='bashekim'?me.rol==='baskekim'    // Başhekim ajandasındaki planların uyarısını (açılış listesi + zaman pop-up'ı) yalnızca Başhekim alır
  :!['birim','nobet'].includes(e.tur)||e.ekleyen===me.id||(e.hedef_birimler||[]).some(b=>me.birimler.includes(b));
const pItem=e=>{const dk=dkKalan(e);return`<div class="pi${dk<0?' gec':''}"><div class="pt"><b>🕒 ${esc(e.saat.slice(0,5))}</b><span>${sureMetni(dk)}</span></div><div class="ps">${esc(TABS[e.tur]?TABS[e.tur][0]:e.tur)}${hbl(e).length?' · '+esc(hbl(e).join(', ')):''}</div>${e.gorevlendirme?`<div class="ps"><b>Görevlendirme</b> · Ekip: ${esc(e.ekip_adi||'')} ${esc(e.ekip_kodu||'')}</div>`:''}<p>${esc(e.aciklama)}</p></div>`};
function popup(b,html){const dl=$('bdlg');if(dl.open)$('bl').insertAdjacentHTML('beforeend',html);else{$('bt').textContent=b;$('bl').innerHTML=html;dl.showModal()}}
$('bk').onclick=()=>$('bdlg').close();
async function bugunYukle(ilk){
  if(!me)return;
  const{data,error}=await db.from('ajanda_notlari').select('*').eq('tarih',iso(new Date())).eq('durum','Planlandı').order('saat');
  if(error)return;
  bugun=(data||[]).filter(ilgili);
  if(!ilk||!bugun.length)return;
  const k='bd_'+me.id+'_'+iso(new Date());
  try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
  bugun.forEach(e=>{const dk=dkKalan(e);if(dk>0&&dk<=10)alarm.add(e.id+'|'+e.saat)});
  popup('📅 Bugünkü planlarınız ('+bugun.length+')',bugun.slice(0,8).map(pItem).join('')+(bugun.length>8?`<p class="emp">+${bugun.length-8} plan daha</p>`:''));
}
function tick(){
  if(!me)return;
  bugun.forEach(e=>{const dk=dkKalan(e),k=e.id+'|'+e.saat;
    if(dk>0&&dk<=10&&!alarm.has(k)){alarm.add(k);popup('⏰ Plan zamanı yaklaşıyor',pItem(e))}});
}
async function enter(){
  const{data:{user}}=await db.auth.getUser();
  if(!user)return showLogin();
  const{data:p}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!p||!p.aktif||!tabsOf(p)){await db.auth.signOut();return showLogin()}
  if(!ortakKullanici(p))return;
  me=p;{const q=new URLSearchParams(location.search).get('tab');tab=(q&&tabsOf(p).includes(q))?q:tabsOf(p)[0]}
  
  
  $('app').classList.remove('hide');
  {const t=new URLSearchParams(location.search).get('tarih');if(t&&/^\d{4}-\d{2}-\d{2}$/.test(t))$('cur').value=t}if(!$('cur').value)$('cur').value=iso(new Date());
  drawTabs();load();
  clearInterval(tickH);clearInterval(yenH);
  tickH=setInterval(tick,30000);yenH=setInterval(()=>bugunYukle(false),120000);
  bugunYukle(true);
}

const rozet=k=>{
  if(isMgr())return TABS[k][4];
  const l=myB().filter(b=>(k==='nobet'?NOBET:MESAI).includes(b));
  if(k==='nobet')return[...(me.rol==='skkm'||me.birimler.includes(SKM)?['SKKM']:[]),...l].join(', ')||'Nöbet';
  return k==='birim'?(l.length===1?l[0]:'Birim'):TABS[k][4];
};
function drawTabs(){
  const T=TABS[tab];document.body.dataset.th=T[3];
  $('tabs').innerHTML=[...tabsOf(me)].sort((a,b)=>(a==='kisisel')-(b==='kisisel')).map(k=>`<button role="tab" data-t="${k}" class="${k===tab?'on':''}" style="${k==='kisisel'?'margin-left:auto':''}" aria-selected="${k===tab}">${TABS[k][2]} ${TABS[k][0]} <span class="bg">${esc(rozet(k))}</span></button>`).join('');
  $('ttl').textContent=T[0];$('sub').textContent=T[1]+(tab==='nobet'&&(isMgr()||me.rol==='skkm'||me.birimler.includes(SKM))?' ':'');
  $('new').classList.toggle('hide',!canWrite(tab));
  const bt=tab==='birim'||tab==='nobet';
  $('flt').classList.toggle('hide',!(bt&&isMgr()));
  if(bt)$('flt').innerHTML='<option value="">Tüm birimler</option>'+(tab==='nobet'?['SKKM',...NOBET]:MESAI).map(b=>`<option>${esc(b)}</option>`).join('');
}

let loadSeq=0;
async function load(){
  const my=++loadSeq,d=weekDays();
  const sel='*,ekleyen_p:profiles!ekleyen(adsoyad),guncelleyen_p:profiles!guncelleyen(adsoyad)';
  const mk=(m,t)=>db.from('ajanda_notlari').select(sel).eq('modul',m).eq('tur',t).gte('tarih',d[0]).lte('tarih',d[d.length-1]).order('saat');
  const f=(tab==='birim'||tab==='nobet')&&isMgr()?$('flt').value:'';
  const qs=[];
  if(tab==='nobet'){
    if(f!=='SKKM')qs.push(f?mk('genel','nobet').contains('hedef_birimler',[f]):mk('genel','nobet'));
    if(!f||f==='SKKM')qs.push(mk('skkm','koordinasyon'));
  }else qs.push(f?mk('genel',tab).contains('hedef_birimler',[f]):mk('genel',tab));
  const rs=await Promise.all(qs);
  if(my!==loadSeq)return;
  if(rs.some(r=>r.error)){toast('Kayıtlar yüklenemedi. Sayfayı yenileyip tekrar deneyin.');return}
  rows=rs.flatMap(r=>r.data||[]);render();
}

const zt=t=>new Date(t).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const card=e=>`<div class="ev ${e.durum==='Gerçekleşti'?'ok':e.durum==='İptal'?'ip':''}${e.gorevlendirme?' gv':''}">
<div class="eh"><b>🕒 ${e.saat.slice(0,5)}</b><span class="pl">${esc(e.durum)}</span></div>
${e.gorevlendirme?`<span class="gb">GÖREVLENDİRME</span> `:''}${hbl(e).length?`<span class="bi">${esc(hbl(e).join(', '))}</span>`:''}
<p>${esc(e.aciklama)}</p>${e.ekip_adi||e.ekip_kodu?`<div class="ekp"><b>Ekip:</b> ${esc(e.ekip_adi||'')}${e.ekip_adi&&e.ekip_kodu?' · ':''}${e.ekip_kodu?'Kod: <b>'+esc(e.ekip_kodu)+'</b>':''}</div>`:''}${e.iptal_nedeni?`<small>İptal nedeni: ${esc(e.iptal_nedeni)}</small>`:''}
<div class="ft"><div><div class="who">Oluşturan: <b>${esc(e.ekleyen_p?.adsoyad||'—')}</b></div><div class="who">Son işlem: <b>${esc((e.guncelleyen?e.guncelleyen_p:e.ekleyen_p)?.adsoyad||'—')}</b> · ${zt(e.guncelleyen?e.updated_at:e.created_at)}</div></div>${canEdit(e)||canDel(e)?`<div class="act">${canEdit(e)?`<button data-e="${e.id}" title="Düzenle" aria-label="Düzenle">✏️</button>`:''}${canDel(e)?`<button data-x="${e.id}" title="Sil" aria-label="Sil">🗑️</button>`:''}${e.tur==='kisisel'&&isMgr()?`<button data-ak="${e.id}" title="Birim ajandasına aktar" aria-label="Aktar">📤</button>`:''}</div>`:''}</div></div>`;

function render(){
  const d=weekDays(),today=iso(new Date());
  $('thead').innerHTML='<tr>'+d.map(s=>`<th class="${s===today?'t0':''}"><b>${GUN7[parse(s).getDay()]}</b><span>${fmt(s)}</span></th>`).join('')+'</tr>';
  $('tbody').innerHTML='<tr>'+d.map(s=>{const ev=rows.filter(r=>r.tarih===s).sort((a,b)=>a.saat.localeCompare(b.saat));return`<td class="col" data-d="${s}">${ev.map(card).join('')||'<p class="emp">Kayıt yok</p>'}</td>`}).join('')+'</tr>';
  $('tbl').style.minWidth=(d.length*170)+'px';
}

function openEdit(ev,date,time){
  $('eid').value=ev?ev.id:'';
  $('dt').textContent=ev?'Planı düzenle':'Plan ekle';
  $('bw').classList.toggle('hide',!['birim','nobet'].includes(tab)||!!(ev&&ev.tur==='koordinasyon'));
  $('eb').innerHTML=[...new Set([...((tab==='nobet'&&ev)?(isMgr()?NOBET:myB().filter(b=>NOBET.includes(b))):birimSecenek()),...(ev?.hedef_birimler||[])])].map(b=>`<label class="ck"><input type="checkbox" value="${esc(b)}"> ${esc(b)}</label>`).join('');
  const sec=ev?(ev.hedef_birimler||[]):(!isMgr()&&birimSecenek().length===1?birimSecenek():[]);
  document.querySelectorAll('#eb input').forEach(i=>{i.checked=sec.includes(i.value)});
  $('ed').value=ev?ev.tarih:(date||$('cur').value);
  $('es').value=ev?ev.saat.slice(0,5):(time||'09:00');
  $('eu').value=ev?ev.durum:'Planlandı';
  $('ei').value=ev?.iptal_nedeni||'';$('iw').classList.toggle('hide',$('eu').value!=='İptal');
  $('ea').value=ev?ev.aciklama:'';
  gorevGoster();$('eg').checked=!!(ev&&ev.gorevlendirme);$('en').value=ev?.ekip_adi||'';$('ek').value=ev?.ekip_kodu||'';$('eg').onchange();
  $('dlg').showModal();
}

$('tabs').onclick=e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;drawTabs();load()}};
$('tbody').onclick=async e=>{
  const ed=e.target.closest('[data-e]'),x=e.target.closest('[data-x]'),ak=e.target.closest('[data-ak]');
  if(ak)return openAktar(rows.find(r=>r.id==ak.dataset.ak));
  if(ed)return openEdit(rows.find(r=>r.id==ed.dataset.e));
  if(x){if(!confirm('Bu kaydı silmek istediğinize emin misiniz?'))return;
    const{data,error}=await db.from('ajanda_notlari').delete().eq('id',x.dataset.x).select('id');
    if(error||!data||!data.length)toast('Kayıt silinemedi. Yetkiniz olmayabilir.');else{toast('Kayıt silindi.');load();bugunYukle(false)}return}
  if(e.target.closest('.ev'))return;
  const td=e.target.closest('td[data-d]');
  if(td&&canWrite(tab))openEdit(null,td.dataset.d,td.dataset.t);
};
$('new').onclick=()=>openEdit(null);
$('ec').onclick=()=>$('dlg').close();
$('eu').onchange=()=>$('iw').classList.toggle('hide',$('eu').value!=='İptal');
const gorevGoster=()=>{const id=$('eid').value,ev=id?rows.find(x=>x.id==id):null;const sk0=ev?ev.tur==='koordinasyon':[...document.querySelectorAll('#eb input:checked')].some(i=>i.value==='SKKM');$('gw').classList.toggle('hide',!sk0)};
$('eb').addEventListener('change',gorevGoster);
$('eg').onchange=()=>{$('ek').required=$('eg').checked;$('ekz').classList.toggle('hide',!$('eg').checked)};
$('ef').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('esv');b.disabled=true;
  const id=$('eid').value;
  const rec={tarih:$('ed').value,saat:$('es').value,durum:$('eu').value,aciklama:$('ea').value.trim()};
  if(!rec.aciklama){b.disabled=false;return}
  rec.iptal_nedeni=rec.durum==='İptal'?$('ei').value.trim():null;
  if(rec.durum==='İptal'&&!rec.iptal_nedeni){b.disabled=false;toast('İptal nedenini yazın.');return}
  if(!$('gw').classList.contains('hide')){
    rec.gorevlendirme=$('eg').checked;rec.ekip_adi=$('en').value.trim()||null;rec.ekip_kodu=$('ek').value.trim()||null;
    if(rec.gorevlendirme&&!rec.ekip_kodu){b.disabled=false;toast('Görevlendirme için ekip kodu zorunludur.');$('ek').focus();return}
  }
  const ev0=id?rows.find(x=>x.id==id):null,koord=!!(ev0&&ev0.tur==='koordinasyon');
  let kayitlar=null;
  if((tab==='birim'||tab==='nobet')&&!koord){
    const hb=[...document.querySelectorAll('#eb input:checked')].map(i=>i.value);
    if(!hb.length){b.disabled=false;toast('En az bir birim seçin.');return}
    const diger=hb.filter(x=>x!=='SKKM');
    if(tab==='nobet'&&!id){
      kayitlar=[];
      if(hb.includes('SKKM'))kayitlar.push({...rec,modul:'skkm',tur:'koordinasyon',ekleyen:me.id});
      if(diger.length){const rn={...rec};delete rn.gorevlendirme;delete rn.ekip_adi;delete rn.ekip_kodu;kayitlar.push({...rn,modul:'genel',tur:'nobet',hedef_birimler:diger,ekleyen:me.id})}
    }else rec.hedef_birimler=diger;
  }
  let r;
  if(id)r=await db.from('ajanda_notlari').update(rec).eq('id',id).select('id');
  else r=await db.from('ajanda_notlari').insert(kayitlar||{...rec,modul:'genel',tur:tab,ekleyen:me.id}).select('id');
  b.disabled=false;
  if(r.error||!r.data||!r.data.length){toast('Kayıt kaydedilemedi. Yetkiniz olmayabilir veya bilgiler eksik.');return}
  $('dlg').close();toast('Kayıt kaydedildi.');load();bugunYukle(false);
});
const shift=n=>{const d=parse($('cur').value||iso(new Date()));d.setDate(d.getDate()+7*n);$('cur').value=iso(d);load()};
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
$('bgn').onclick=()=>{$('cur').value=iso(new Date());load()};
$('cur').onchange=()=>{if($('cur').value)load()};
$('flt').onchange=load;$('rf').onclick=load;
const isoHafta=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)};
function pdfHazirla(){
  const d=weekDays(),T=TABS[tab][0],eski=document.title,n=d.length;
  const L=(x,o)=>parse(x).toLocaleDateString('tr-TR',o);
  const aralik=L(d[0],{day:'numeric',month:'long'})+' – '+L(d[n-1],{day:'numeric',month:'long',year:'numeric'});
  const say=f=>rows.filter(f).length;
  const AMB='<svg class="amb" viewBox="0 0 48 32" aria-hidden="true"><path d="M3 25V8a2 2 0 0 1 2-2h22a2 2 0 0 1 2 2v17"/><path d="M29 12h7l7 7v6"/><path d="M3 25h5M17 25h12M39 25h4"/><path d="M3 15h26"/><path d="M13 6V3h6v3"/><circle cx="12.5" cy="26" r="3.5"/><circle cx="34.5" cy="26" r="3.5"/></svg>';
  const kart=e=>`<div class="pv ${e.durum==='Gerçekleşti'?'ok':e.durum==='İptal'?'ip':''}${e.gorevlendirme?' gv':''}"><div class="r1"><span class="tm">${esc(e.saat.slice(0,5))}</span><span class="pl2">${esc(e.durum)}</span></div>${e.gorevlendirme?'<span class="gb2">GÖREVLENDİRME</span>':''}${hbl(e).length?`<span class="bd">${esc(hbl(e).join(', '))}</span>`:''}<p>${esc(e.aciklama)}</p>${e.ekip_adi||e.ekip_kodu?`<div class="m"><b>Ekip:</b> ${esc(e.ekip_adi||'')}${e.ekip_adi&&e.ekip_kodu?' · ':''}${e.ekip_kodu?'Kod: <b>'+esc(e.ekip_kodu)+'</b>':''}</div>`:''}${e.iptal_nedeni?`<div class="m">İptal nedeni: ${esc(e.iptal_nedeni)}</div>`:''}<div class="m">Oluşturan: <b>${esc(e.ekleyen_p?.adsoyad||'—')}</b></div><div class="m">Son işlem: <b>${esc((e.guncelleyen?e.guncelleyen_p:e.ekleyen_p)?.adsoyad||'—')}</b> · ${zt(e.guncelleyen?e.updated_at:e.created_at)}</div></div>`;
  const baslik=s=>{const g=parse(s).getDay();return`<th class="${g===0||g===6?'we':''}"><b>${GUN7[g]}</b><span>${L(s,{day:'numeric',month:'long'})}</span></th>`};
  const kolon=s=>`<td>${rows.filter(r=>r.tarih===s).sort((a,b)=>a.saat.localeCompare(b.saat)).map(kart).join('')||'<div class="pe">—</div>'}</td>`;
  $('pr').className=n>5?'n7':'';
  $('pr').innerHTML=`<div class="pbd"><div class="l">${AMB}<div><div class="k">Çanakkale İASB</div><div class="t">${esc(T)}</div></div></div><div class="r"><div class="a">${aralik}</div><div class="h">${isoHafta(parse(d[0]))}. hafta · Kurumsal Ajanda</div></div></div>`
   +`<div class="pst"><b>${rows.length} plan</b><span><i style="background:#cbd5e1"></i>Planlandı ${say(r=>r.durum==='Planlandı')}</span><span><i style="background:#5fa37a"></i>Gerçekleşti ${say(r=>r.durum==='Gerçekleşti')}</span><span><i style="background:#d4747f"></i>İptal ${say(r=>r.durum==='İptal')}</span>${yedi()?`<span><i style="background:#e0b84e"></i>Görevlendirme ${say(r=>r.gorevlendirme)}</span>`:''}</div>`
   +`<table><thead><tr>${d.map(baslik).join('')}</tr></thead><tbody><tr>${d.map(kolon).join('')}</tr></tbody></table>`
   +`<div class="pft"><span>Çıktıyı alan: ${esc(me.adsoyad)} · ${new Date().toLocaleString('tr-TR')}</span><span>Çanakkale İASB Kurumsal Ajanda</span></div>`;
  document.title='Ajanda_'+T.replace(/\s+/g,'_')+'_'+d[0];
  window.onafterprint=()=>{document.title=eski;window.onafterprint=null};
  window.print();
}
$('prt').onclick=pdfHazirla;

// ---- Kişisel notu birim ajandasına aktarma ----
const ahd=()=>document.querySelector('input[name=ahd]:checked').value;
function abxDoldur(){$('abx').innerHTML=(ahd()==='nobet'?NOBET:MESAI).map(b=>`<label class="ck"><input type="checkbox" value="${esc(b)}"> ${esc(b)}</label>`).join('')}
document.querySelectorAll('input[name=ahd]').forEach(r=>{r.onchange=abxDoldur});
abxDoldur();
function openAktar(ev){
  if(!ev)return;
  $('aid').value=ev.id;$('ametin').textContent=ev.aciklama;
  $('atr').value=ev.tarih;$('asa').value=ev.saat.slice(0,5);
  document.querySelector('input[name=ahd][value="birim"]').checked=true;abxDoldur();
  document.querySelector('input[name=atas][value="0"]').checked=true;
  $('adlg').showModal();
}
$('aiptal').onclick=()=>$('adlg').close();
$('af').addEventListener('submit',async e=>{
  e.preventDefault();
  const bl=[...document.querySelectorAll('#abx input:checked')].map(i=>i.value);
  if(!bl.length)return toast('En az bir birim seçin.');
  const tasi=document.querySelector('input[name=atas]:checked').value==='1';
  if(!confirm('Bu not seçilen birimlere görünür olacak'+(tasi?' ve kişisel ajandanızdan silinecek':'')+'. Devam edilsin mi?'))return;
  const b=$('asv');b.disabled=true;
  const{error}=await db.rpc('kisisel_aktar',{p_id:Number($('aid').value),p_birimler:bl,p_tarih:$('atr').value,p_saat:$('asa').value,p_tasi:tasi,p_tur:ahd()});
  b.disabled=false;
  if(error)return toast('Hata: '+error.message);
  $('adlg').close();toast('Not aktarıldı: '+bl.join(', '));load();bugunYukle(false);
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
db.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me)showLogin()});
db.auth.getSession().then(({data:{session}})=>session?enter():showLogin());
</script>
