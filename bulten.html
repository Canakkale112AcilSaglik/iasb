<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1e2f4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="112 İASB">
<title>Haftalık Bülten · Çanakkale 112 İASB</title>
<style>
:root{--c:#1e2f4f;--d:#14213b;--l:#e8edf5}
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;font:14px/1.45 "Segoe UI",Tahoma,Geneva,Verdana,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.hide{display:none!important}
.b{background:var(--c);color:#fff;border-radius:12px;padding:8px 14px;font-weight:600;font-size:12px;text-decoration:none;display:inline-block}
.b:hover{background:var(--d)}.b.g{background:#f1f5f9;color:#334155}.b.g:hover{background:#e2e8f0}
.b.bl{background:rgba(0,0,0,.2)}.b.em{background:#3b6b4c}.b:disabled{opacity:.6}
label{display:block;font-size:11px;font-weight:700;color:#64748b;margin:10px 0 4px;text-transform:uppercase}
label.ck{display:flex;gap:6px;align-items:center;text-transform:none;font-size:12px;font-weight:500;color:#334155;margin:3px 0}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}
.ck input{width:auto}textarea{min-height:80px;resize:vertical}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px}
header.top{background:var(--c);color:#fff;padding:14px 16px}
.hi{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
header h1{font-size:21px;margin:0}
.ub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 14px}
nav{background:#fff;border-bottom:1px solid #e2e8f0}
nav div{max-width:1200px;margin:0 auto;display:flex;gap:6px;padding:0 16px;overflow-x:auto}
nav a{padding:12px 16px;font-weight:600;color:#64748b;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
nav a:hover{color:#1e293b}nav a.on{color:var(--c);border-bottom-color:var(--c)}
main{max-width:1200px;margin:0 auto;padding:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp .card b{display:block;font-size:28px;color:var(--c)}.kp .card span{color:#64748b;font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
.tb{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tb h2{font-size:16px;margin:0}
.pl{display:block;text-decoration:none;color:inherit;border:1px solid #cbd5e1;background:#f8fafc;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pl:hover{background:var(--l);border-color:var(--c)}
.pl.ok{background:#eef6f0;border-color:#b7d7c3}.pl.ip{background:#fbeff0;border-color:#efc3c9}
.pl .r1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.pl .m{font-size:12px;color:#64748b}.pl p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{font-size:11px;border-radius:99px;padding:1px 9px;background:#e2e8f0;color:#334155;font-weight:600}
.emp{color:#94a3b8;text-align:center;padding:16px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.bar i{display:block;height:12px;background:var(--c);border-radius:6px;min-width:2px}
.bar span:first-child{width:170px;flex:none}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #e2e8f0;padding:5px 8px;text-align:left;vertical-align:top}th{background:#f8fafc}
.sc{overflow:auto;max-height:420px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
dialog{border:0;border-radius:16px;padding:22px;width:min(480px,94vw);box-shadow:0 20px 40px rgba(15,23,42,.35)}
dialog::backdrop{background:rgba(15,23,42,.6)}
dialog h2{margin:0 0 6px;font-size:17px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:99}

#adm{width:min(780px,96vw);max-height:92vh}
dialog h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#475569;margin:16px 0 8px}
.g3{display:grid;gap:10px;grid-template-columns:1.3fr 1fr 1fr}
.ubx{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}
.btns .b{flex:1;padding:10px}
.pn{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
.ur{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:12px}
.ur small{display:block;color:#64748b}.ua{display:flex;gap:6px;flex-shrink:0}
.b.am{background:#a16207}.b.ro{background:#e11d48}
.chip.pas{background:#fee2e2;color:#b91c1c}
.atab{display:flex;gap:6px;border-bottom:1px solid #e2e8f0;margin:12px 0}
.atab button{background:none;padding:9px 14px;font-weight:600;color:#64748b;border-bottom:3px solid transparent}
.atab button.on{color:var(--c);border-bottom-color:var(--c)}
@media(max-width:700px){.g3{grid-template-columns:1fr}.ur{flex-direction:column;align-items:flex-start}}
.pl a{color:inherit;text-decoration:none}.pl .r1>a{flex:1}.pl .pa{display:block}
@media print{header,nav,#tabs,.noprint{display:none!important}body{background:#fff}.sc{max-height:none;overflow:visible}}

.donem{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.donem label{margin:0;color:#334155;text-transform:none;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
#week{width:92px;padding:5px 9px}#range{width:140px;padding:5px 9px}
#period{font-size:12px}
#tabs{max-width:1200px;margin:0 auto;display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
.tab{background:#fff;border:1px solid #cbd5e1;color:#334155;border-radius:99px;padding:6px 14px;font-weight:600;font-size:12px;white-space:nowrap}
.tab:hover{background:var(--l)}.tab.on{background:var(--c);color:#fff;border-color:var(--c)}
.bar{flex-wrap:wrap;margin:0 0 12px;font-size:14px}
section.card{margin-bottom:14px}.card h3{margin:0 0 10px;font-size:14px;color:var(--c)}
.scroll{overflow-x:auto;margin-bottom:10px}
td,th{border:1px solid #e2e8f0;padding:3px 6px}
th{background:var(--c);color:#fff;font-weight:600}
.lbl{background:#f1f5f9}.prev{color:#64748b;text-align:center}
td input{width:100%;border:0;background:transparent;text-align:center;padding:4px;border-radius:0}
td input:disabled,textarea:disabled{background:#f8fafc;color:#64748b}
#status{color:#64748b}
#toast{opacity:0;transition:.2s}#toast.on{opacity:1}
.b:disabled{cursor:not-allowed}

/* okunaklı tablolar */
table{font-size:13px}
td,th{height:auto;vertical-align:middle;padding:6px 8px;border:1px solid #cbd5e1}
th,th.lbl,th.prev{background:var(--c);color:#fff;font-weight:700;text-align:center}
td.lbl{background:#eef2f7;color:#0f172a;font-weight:600}
td.prev{background:#f8fafc;color:#475569;font-weight:600}
td input{background:#fff;color:#0f172a;border:1px solid #cbd5e1;border-radius:6px;padding:5px 6px;text-align:center}
td input:focus,textarea:focus{outline:2px solid #f59e0b;outline-offset:0}
td input:disabled,textarea:disabled{background:#f1f5f9;color:#475569}
textarea{background:#fff;color:#0f172a;font-size:13px;min-height:90px}
.card h3{font-size:15px;padding-bottom:6px;border-bottom:2px solid var(--l)}
#app{display:flex;flex-direction:column;min-height:100vh}
main{max-width:1400px;width:100%;flex:1}
#tabs{max-width:1400px;width:100%}
.yok{text-align:center;padding:48px 16px;font-size:17px;font-weight:600;color:#475569}

/* ---- Okunaklı ve hizalı giriş tabloları: Geçen Hafta (otomatik) / Bu Hafta (girilecek) ---- */
#form table{table-layout:auto;width:100%;border-collapse:separate;border-spacing:0;border:1px solid #94a3b8;border-radius:10px;overflow:hidden;background:#fff}
#form td,#form th{text-align:center;vertical-align:middle;padding:7px 10px;border:0;border-bottom:1px solid #d5deea;border-right:1px solid #d5deea}
#form tr:last-child td{border-bottom:0}#form td:last-child,#form th:last-child{border-right:0}
#form td.lbl:first-child{text-align:left;font-weight:600}
#form table.t3 td:first-child,#form table.t3 th:first-child{width:52%}
#form table.t3 td:not(:first-child),#form table.t3 th:not(:first-child){width:24%}
#form table.t2 td:first-child,#form table.t2 th:first-child{width:72%}
#form table.t2 td:last-child,#form table.t2 th:last-child{width:28%}
/* Geçen Hafta: otomatik gelir, kilitli görünür */
#form th.lbl.hprev{background:#475569;color:#fff}
#form td.prev{background:#e2e8f0;color:#334155;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;border-right:2px solid #94a3b8}
/* Bu Hafta / girilecek hücreler: yeşil vurgu, beyaz kutu */
#form th.lbl.hcur{background:#2f6b45;color:#fff}
#form td.in{background:#e6f4ea}
#form td.in input{display:block;width:100%;min-width:64px;max-width:130px;margin:0 auto;background:#fff;color:#0f172a;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:center;border:2px solid #6aa883;border-radius:8px;padding:6px 6px}
#form td.in input:hover{border-color:#2f6b45}
#form td.in input:focus{border-color:#f59e0b;outline:3px solid rgba(245,158,11,.35)}
#form td.in input:disabled{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
#form td.in:has(input:disabled){background:#f1f5f9}
.lejant{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:#334155;margin:0 0 12px}
.lejant i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
@media(max-width:700px){#form td,#form th{padding:6px 5px}#form td.in input{min-width:52px}}
</style></head><body>
<div id="app" style="display:none"><div id="ortak-ust" data-sayfa="bulten"></div>
<script src="ortak.js?v=6"></script>
<div id="tabs"></div>
<main><div class="bar"><button id="save" class="b">💾 Bu haftayı kaydet</button><button id="approve" class="b am"></button><span id="status"></span>
<span style="flex:1"></span>
<div class="donem"><label class="adm">Hafta <input id="week" placeholder="2026-38"></label>
<label class="adm">Tarih aralığı <input id="range" placeholder="11-18.09.2026"></label>
<span id="period"></span></div><button id="export" class="b em">📊 Sunuyu oluştur</button>
<button id="roll" class="b ro" title="Haftayı onayla, geçmişi sil, yeni haftaya geç">🔄 Onayla ve geçmişi sil</button></div><div id="err" class="noprint" style="color:#be123c;margin-bottom:10px"></div><div class="lejant noprint"><span><i style="background:#94a3b8"></i>Geçen Hafta (otomatik gelir, değiştirilemez)</span><span><i style="background:#6aa883"></i>Bu Hafta (bilgileri buraya girin)</span></div><div id="form"></div></main><footer class="ort-alt" data-ort-alt></footer></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="bulten-config.js"></script><script src="bulten-app.js?v=8"></script></body></html>
