<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haftalık Bülten</title>
<style>
:root{--red:#e30a17;--bg:#f4f4f6;--card:#fff;--tx:#1d1d22;--mut:#6b6b76;--ln:#d9d9e0}
@media(prefers-color-scheme:dark){:root{--bg:#17171b;--card:#222228;--tx:#eee;--mut:#9a9aa6;--ln:#3a3a44}}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--red);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}header input{padding:5px 8px;border:0;border-radius:6px;width:90px}header #range{width:130px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--red);color:#fff;border-color:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}
#tabs{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto;border-bottom:2px solid var(--red)}
.tab{border-radius:8px 8px 0 0;border-bottom:0;white-space:nowrap}.tab.on{background:var(--red);color:#fff;border-color:var(--red)}
main{max-width:1000px;margin:0 auto;padding:16px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:14px;color:var(--red)}
.scroll{overflow-x:auto;margin-bottom:10px}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--ln);padding:3px 6px}
th{background:var(--red);color:#fff;font-weight:600}.lbl{background:rgba(128,128,128,.12)}.prev{color:var(--mut);text-align:center}
td input{width:100%;box-sizing:border-box;border:0;background:transparent;color:inherit;font:inherit;text-align:center;padding:4px}
textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--ln);border-radius:8px;background:transparent;color:inherit;font:inherit}
#status{color:var(--mut)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.2s}#toast.on{opacity:1}
#login{max-width:320px;margin:15vh auto;display:flex;flex-direction:column;gap:10px}#login input{padding:9px;border:1px solid var(--ln);border-radius:8px}
</style></head><body>
<div id="login" style="display:none"><h2>Haftalık Bülten</h2>
<form id="lf" style="display:flex;flex-direction:column;gap:8px"><b>Ajanda hesabınla giriş yap</b><input id="em" placeholder="Kullanıcı adı / e-posta" required><input id="pw" type="password" placeholder="Şifre" required><button class="p">Giriş</button></form>
<small id="le" style="color:var(--red)"></small><button id="lo" type="button">Çıkış / başka kullanıcı</button></div>
<div id="app"><header><b>Haftalık Bülten <small>v3</small></b>
<label class="adm">Hafta <input id="week" placeholder="2026-38"></label>
<label class="adm">Tarih aralığı <input id="range" placeholder="11-18.09.2026"></label>
<span id="period"></span><a href="index.html" style="color:#fff;margin-left:auto">🏠 Ana sayfa</a><span id="who"></span><button id="out">Çıkış</button></header>
<div id="tabs"></div>
<main><div class="bar"><button id="save" class="p">Bu haftayı kaydet</button><button id="approve"></button><span id="status"></span>
<span style="flex:1"></span><button id="export" class="p">📊 Sunuyu oluştur</button></div><div id="err" style="color:var(--red);margin-bottom:10px"></div><div id="form"></div></main></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="bulten-config.js"></script><script src="bulten-app.js"></script></body></html>
