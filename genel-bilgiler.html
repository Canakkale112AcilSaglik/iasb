<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://adylgqlzumwnzgehqjwf.supabase.co; img-src 'self' data:; base-uri 'none'">
<title>Genel Bilgiler · Çanakkale 112 İASB</title>
<meta name="theme-color" content="#1e2f4f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script>
<style>

:root{--c:#1e2f4f;--d:#14213b;--l:#e8edf5}
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;font:14px/1.45 "Segoe UI",Tahoma,Geneva,Verdana,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.hide{display:none!important}
.b{background:var(--c);color:#fff;border-radius:12px;padding:8px 14px;font-weight:600;font-size:12px;text-decoration:none;display:inline-block}
.b:hover{background:var(--d)}.b.g{background:#f1f5f9;color:#334155}.b.g:hover{background:#e2e8f0}
.b.bl{background:rgba(0,0,0,.2)}.b.em{background:#3b6b4c}.b:disabled{opacity:.6}
label{display:block;font-size:11px;font-weight:700;color:#64748b;margin:10px 0 4px;text-transform:uppercase}
label.ck{display:flex;gap:6px;align-items:center;text-transform:none;font-size:12px;font-weight:500;color:#334155;margin:3px 0}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}
.ck input{width:auto}textarea{min-height:80px;resize:vertical}
.err{color:#be123c;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:8px;font-size:12px;text-align:center;margin-top:12px}
#login{position:fixed;inset:0;background:rgba(15,23,42,.72);display:grid;place-items:center;padding:16px;z-index:50}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px}
#login .card{width:min(420px,100%);padding:28px}
#login h1{font-size:19px;text-align:center;margin:0 0 12px}
header.top{background:var(--c);color:#fff;padding:14px 16px}
.hi{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
header h1{font-size:21px;margin:0}
.ub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 14px}
nav{background:#fff;border-bottom:1px solid #e2e8f0}
nav div{max-width:1200px;margin:0 auto;display:flex;gap:6px;padding:0 16px;overflow-x:auto}
nav a{padding:12px 16px;font-weight:600;color:#64748b;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
nav a:hover{color:#1e293b}nav a.on{color:var(--c);border-bottom-color:var(--c)}
main{max-width:1200px;margin:0 auto;padding:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp .card b{display:block;font-size:28px;color:var(--c)}.kp .card span{color:#64748b;font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
.tb{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tb h2{font-size:16px;margin:0}
.pl{display:block;text-decoration:none;color:inherit;border:1px solid #cbd5e1;background:#f8fafc;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pl:hover{background:var(--l);border-color:var(--c)}
.pl.ok{background:#eef6f0;border-color:#b7d7c3}.pl.ip{background:#fbeff0;border-color:#efc3c9}
.pl .r1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.pl .m{font-size:12px;color:#64748b}.pl p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{font-size:11px;border-radius:99px;padding:1px 9px;background:#e2e8f0;color:#334155;font-weight:600}
.emp{color:#94a3b8;text-align:center;padding:16px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.bar i{display:block;height:12px;background:var(--c);border-radius:6px;min-width:2px}
.bar span:first-child{width:170px;flex:none}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #e2e8f0;padding:5px 8px;text-align:left;vertical-align:top}th{background:#f8fafc}
.sc{overflow:auto;max-height:420px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
dialog{border:0;border-radius:16px;padding:22px;width:min(480px,94vw);box-shadow:0 20px 40px rgba(15,23,42,.35)}
dialog::backdrop{background:rgba(15,23,42,.6)}
dialog h2{margin:0 0 6px;font-size:17px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:99}

#adm{width:min(780px,96vw);max-height:92vh}
dialog h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#475569;margin:16px 0 8px}
.g3{display:grid;gap:10px;grid-template-columns:1.3fr 1fr 1fr}
.ubx{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}
.btns .b{flex:1;padding:10px}
.pn{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
.ur{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:12px}
.ur small{display:block;color:#64748b}.ua{display:flex;gap:6px;flex-shrink:0}
.b.am{background:#a16207}.b.ro{background:#e11d48}
.chip.pas{background:#fee2e2;color:#b91c1c}
.atab{display:flex;gap:6px;border-bottom:1px solid #e2e8f0;margin:12px 0}
.atab button{background:none;padding:9px 14px;font-weight:600;color:#64748b;border-bottom:3px solid transparent}
.atab button.on{color:var(--c);border-bottom-color:var(--c)}
@media(max-width:700px){.g3{grid-template-columns:1fr}.ur{flex-direction:column;align-items:flex-start}}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}.sc{max-height:none;overflow:visible}}

.sc th{position:sticky;top:0;z-index:1}
td button{padding:2px 8px;border-radius:8px;background:#f1f5f9;color:#334155}
.panel{margin-bottom:14px}
.row select{min-width:130px}
</style>
</head>
<body>
<div id="app" class="hide">
 <header class="top"><div class="hi">
  <h1>🚑 Çanakkale 112 İASB</h1>
  <div class="ub"><b id="who" style="font-size:12px"></b>
   <button class="b bl" id="out" style="border:1px solid rgba(255,255,255,.55)">⏻ Çıkış</button></div>
 </div></header>
 <nav><div>
  <a href="index.html">🏠 Ana Sayfa</a>
  <a href="ajanda.html">🗓️ Ajanda</a>
  <a href="bulten.html">📰 Bülten</a>
  <a href="genel-bilgiler.html" class="on">ℹ️ Genel Bilgiler</a>
 </div></nav>
 <main>
  <div class="atab noprint" id="stab">
   <button type="button" data-s="ist" class="on">📍 İstasyonlar ve telsiz kodları</button>
   <button type="button" data-s="arac">🚑 Ambulanslar / Araçlar</button>
  </div>
  <section id="s_ist">
   <div class="card panel" id="p_ist"></div>
   <div class="card panel" id="p_tel"></div>
  </section>
  <section id="s_arac" class="hide">
   <div class="card panel" id="p_arac"></div>
  </section>
 </main>
</div>

<dialog id="gdlg">
 <form id="gf">
  <h2 id="gt"></h2>
  <div id="gfields"></div>
  <div class="btns"><button type="button" class="b ro hide" id="gdel" style="flex:none">🗑️ Sil</button><button type="button" class="b g" id="gc">Vazgeç</button><button class="b" id="gs">💾 Kaydet</button></div>
 </form>
</dialog>
<div id="toast" class="hide"></div>

<script>
const SB_URL='https://adylgqlzumwnzgehqjwf.supabase.co';
const SB_KEY='sb_publishable_6FJPyl7rxOdLsjhqEWM4hA_6Ez9g2i4';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A='İIıÇçĞğÖöŞşÜü',B='iiiccggoossuu';
const sade=s=>String(s??'').replace(/[İIıÇçĞğÖöŞşÜü]/g,c=>B[A.indexOf(c)]).toLowerCase();
const fmt=s=>s?String(s).split('-').reverse().join('.'):'';
const yil=new Date().getFullYear();
const CFG={
 ist:{table:'gb_istasyonlar',title:'İstasyonlar',cols:[{k:'ilce',t:'İlçe',f:1},{k:'istasyon',t:'İstasyon',req:1},{k:'kod',t:'Kod'},{k:'tip',t:'Tip',f:1},{k:'acilis',t:'Açılış tarihi',type:'date'},{k:'arsa',t:'Arsa mülkiyeti',f:0,dl:1},{k:'bina',t:'Bina mülkiyeti',dl:1},{k:'kullanim',t:'Bina kullanım detayı'}]},
 tel:{table:'gb_telsiz',title:'Telsiz / ekip kodları',cols:[{k:'grup',t:'Grup',f:1,req:1},{k:'ad',t:'Ad',req:1},{k:'kod',t:'Kod'}]},
 arac:{table:'gb_araclar',title:'Ambulans ve araç listesi',cols:[{k:'plaka',t:'Plaka'},{k:'model_yili',t:'Model yılı',type:'number'},{k:'marka',t:'Marka',f:1},{k:'model',t:'Model'},{k:'gorev',t:'Görev',f:1},{k:'tur',t:'Tür',f:1},{k:'birim',t:'Birim'},{k:'kullanim',t:'Kullanım',f:1},{k:'aciklama',t:'Açıklama'}]}
};
const D={ist:[],tel:[],arac:[]},ST={};let admin=false,ed=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),4500)}
const cell=(x,r)=>x.type==='date'?fmt(r[x.k]):esc(r[x.k]);
const uniq=(key,k)=>[...new Set(D[key].map(r=>r[k]).filter(v=>v!=null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));

function buildPanel(key){
  const c=CFG[key];
  $('p_'+key).innerHTML=`<div class="tb"><h2>${c.title} <span class="chip" id="n_${key}"></span></h2>
   <div>${admin?`<button class="b em" data-add="${key}">➕ Ekle</button> `:''}<button class="b g" data-csv="${key}">⬇️ CSV</button></div></div>
   <div class="row noprint"><div><input id="q_${key}" placeholder="Ara..."></div>${c.cols.filter(x=>x.f).map(x=>`<div><select id="f_${key}_${x.k}"></select></div>`).join('')}</div>
   ${key==='arac'?'<div id="st_arac" style="margin-top:12px"></div>':''}
   <div class="sc" id="t_${key}" style="margin-top:12px"></div>`;
  ST[key]={};
  $('q_'+key).oninput=()=>draw(key);
  c.cols.filter(x=>x.f).forEach(x=>$(`f_${key}_${x.k}`).onchange=()=>draw(key));
}
function refill(key){
  CFG[key].cols.filter(x=>x.f).forEach(x=>{
    const s=$(`f_${key}_${x.k}`),v=s.value;
    s.innerHTML=`<option value="">${x.t}: tümü</option>`+uniq(key,x.k).map(o=>`<option>${esc(o)}</option>`).join('');s.value=v;
  });
}
function filtered(key){
  const c=CFG[key],q=sade($('q_'+key).value.trim());
  return D[key].filter(r=>c.cols.every(x=>{const f=x.f?$(`f_${key}_${x.k}`).value:'';return !f||String(r[x.k]??'')===f})
    &&(!q||c.cols.some(x=>sade(cell(x,r)).includes(q))));
}
const dag=(rows,fn)=>{const m={};rows.forEach(r=>{const k=fn(r);if(k!=null&&k!=='')m[k]=(m[k]||0)+1});return Object.entries(m)};
const bars=(t,list)=>{const mx=Math.max(1,...list.map(x=>x[1]));return`<div class="card" style="padding:12px"><b>${t}</b>${list.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/mx*100}px;max-width:50%"></i><span>${v}</span></div>`).join('')||'<div class="emp">Veri yok</div>'}</div>`};
const byCnt=l=>l.sort((a,b)=>b[1]-a[1]);
function aracStats(rows){
  const r=rows.filter(x=>x.plaka),ys=r.map(x=>x.model_yili).filter(Boolean);
  const ort=ys.length?yil-ys.reduce((a,b)=>a+b,0)/ys.length:0;
  $('st_arac').innerHTML=`<div class="kp"><div class="card"><b>${r.length}</b><span>Araç (plakalı kayıt)</span></div>
   <div class="card"><b>${ys.length?ort.toFixed(1):'–'}</b><span>Ortalama araç yaşı</span></div>
   <div class="card"><b>${ys.filter(y=>yil-y>=10).length}</b><span>10 yaş ve üzeri</span></div>
   <div class="card"><b>${ys.length?Math.max(...ys):'–'}</b><span>En yeni model yılı</span></div></div>
   <div class="g2">${bars('Türe göre',byCnt(dag(r,x=>x.tur)))}${bars('Kullanıma göre',byCnt(dag(r,x=>x.kullanim)))}${bars('Göreve göre',byCnt(dag(r,x=>x.gorev)))}${bars('Model yılına göre',dag(r,x=>x.model_yili).sort((a,b)=>a[0]-b[0]))}</div>`;
}
function draw(key){
  const c=CFG[key],rows=filtered(key);
  $('n_'+key).textContent=rows.length+(rows.length!==D[key].length?' / '+D[key].length:'');
  $('t_'+key).innerHTML=`<table><thead><tr>${c.cols.map(x=>`<th>${x.t}</th>`).join('')}${admin?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${c.cols.map(x=>`<td>${cell(x,r)}</td>`).join('')}${admin?`<td><button data-edit="${key}:${r.id}">✏️</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${c.cols.length+1}" class="emp">Kayıt yok</td></tr>`}</tbody></table>`;
  if(key==='arac')aracStats(rows);
}
async function load(key){
  const{data,error}=await db.from(CFG[key].table).select('*').order('id').limit(5000);
  if(error){$('t_'+key).innerHTML='<div class="emp">Liste alınamadı. genel_bilgiler_kurulum.sql çalıştırıldı mı?</div>';return}
  D[key]=data||[];refill(key);draw(key);
}
$('stab').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;
  document.querySelectorAll('#stab button').forEach(x=>x.classList.toggle('on',x===b));
  $('s_ist').classList.toggle('hide',b.dataset.s!=='ist');$('s_arac').classList.toggle('hide',b.dataset.s!=='arac')};
function csv(key){
  const c=CFG[key],rows=filtered(key),q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
  const m='\ufeff'+c.cols.map(x=>q(x.t)).join(';')+'\r\n'+rows.map(r=>c.cols.map(x=>q(cell(x,r).replace(/&amp;/g,'&'))).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([m],{type:'text/csv;charset=utf-8'}));a.download=c.table+'.csv';document.body.appendChild(a);a.click();a.remove();
}
function openEdit(key,id){
  const c=CFG[key],r=id?D[key].find(x=>x.id==id):{};ed={key,id};
  $('gt').textContent=(id?'Düzenle: ':'Ekle: ')+c.title;
  $('gfields').innerHTML=c.cols.map(x=>`<label for="g_${x.k}">${x.t}</label><input id="g_${x.k}" type="${x.type||'text'}"${x.req?' required':''}${x.f||x.dl?` list="dl_${x.k}"`:''} value="${esc(r[x.k]??'')}">`).join('')
    +c.cols.filter(x=>x.f||x.dl).map(x=>`<datalist id="dl_${x.k}">${uniq(key,x.k).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`).join('');
  $('gdel').classList.toggle('hide',!id);$('gdlg').showModal();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'),d=e.target.closest('[data-edit]'),c=e.target.closest('[data-csv]');
  if(a)openEdit(a.dataset.add,null);
  if(d){const[k,i]=d.dataset.edit.split(':');openEdit(k,i)}
  if(c)csv(c.dataset.csv);
});
$('gc').onclick=()=>$('gdlg').close();
$('gf').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('gs');b.disabled=true;const{key,id}=ed,c=CFG[key],rec={};
  c.cols.forEach(x=>{const v=$('g_'+x.k).value.trim();rec[x.k]=v===''?null:(x.type==='number'?Number(v):v)});
  const r=id?await db.from(c.table).update(rec).eq('id',id).select('id'):await db.from(c.table).insert(rec).select('id');
  b.disabled=false;
  if(r.error||!r.data||!r.data.length){toast('Kaydedilemedi. Yetkiniz olmayabilir.');return}
  $('gdlg').close();toast('Kaydedildi.');load(key);
});
$('gdel').onclick=async()=>{
  if(!ed||!ed.id||!confirm('Bu kayıt silinsin mi?'))return;
  const r=await db.from(CFG[ed.key].table).delete().eq('id',ed.id).select('id');
  if(r.error||!r.data||!r.data.length){toast('Silinemedi.');return}
  $('gdlg').close();toast('Kayıt silindi.');load(ed.key);
};
$('out').onclick=async()=>{await db.auth.signOut();location.href='index.html'};
(async()=>{
  const{data:{user}}=await db.auth.getUser();
  if(!user){location.href='index.html';return}
  const{data:p}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!p||!p.aktif){location.href='index.html';return}
  admin=p.rol==='admin';$('who').textContent='👤 '+p.adsoyad+(admin?' (Yönetici)':'');
  $('app').classList.remove('hide');
  Object.keys(CFG).forEach(buildPanel);
  Object.keys(CFG).forEach(load);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
